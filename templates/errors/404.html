{% extends "base.html" %}
{% block title %}404 Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 550px;">
        <div class="display-1 text-warning mb-3">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4">
            The page or record you are searching for does not exist or may have been moved.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
                <i class="bi bi-house me-1"></i> Return to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-3">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
