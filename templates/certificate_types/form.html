{% extends "base.html" %}
{% block title %}{{ action }} Certificate Type{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-tag text-primary me-2"></i>{{ action }} Certificate Type
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="type_name" class="form-label required-star">Type Name *</label>
                        <input type="text" class="form-control" id="type_name" name="type_name" 
                               value="{{ cert_type.Type_Name if cert_type else '' }}" 
                               required maxlength="50" placeholder="e.g. Degree Certificate, Semester Grade Card">
                        <div class="form-text">Must be unique across certificate categories.</div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" 
                                  maxlength="255" placeholder="Brief summary of what this certificate type represents">{{ cert_type.Description if cert_type else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('certificate_types.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i> Save Type
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
